<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Vize Notu Girişi | Not Portalı</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📝 Ders ve Vize Bilgileri</h1>
        <p style="color: rgba(255,255,255,0.7); margin-top: 5px;">Hesaplama işleminin ilk adımını tamamlayın</p>
    </header>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="vize.html" class="active">Vize Girişi</a>
        <a href="final.html">Final Girişi</a>
        <a href="hesapla.html">Hesapla</a>
        <a href="sonuc.html">Sonuç Raporu</a>
    </nav>

    <main>
        <section class="container">
            <h2>Vize Parametrelerini Girin</h2>
            <p style="color: rgba(255,255,255,0.8); margin-bottom: 20px;">Lütfen aşağıdaki alanları doldurun.</p>
            
            <form id="vizeForm" novalidate>
                <div class="form-group">
                    <label for="dersAdi">Ders Adı (İsteğe Bağlı)</label>
                    <div class="input-container">
                        <input type="text" id="dersAdi" placeholder="Örn: İnternet Programcılığı I">
                        <span class="validation-indicator"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="vize">Vize Sınav Notu</label>
                    <div class="input-container">
                        <input type="number" id="vize" placeholder="0 - 100 arası" min="0" max="100" required>
                        <span class="validation-indicator"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="vizeOran">Vize Notu Etki Yüzdesi (%)</label>
                    <div class="input-container">
                        <input type="number" id="vizeOran" placeholder="Örn: 40" min="0" max="100" required>
                        <span class="validation-indicator"></span>
                    </div>
                </div>

                <div id="vizeHata" class="error-msg"></div>

                <button type="submit" class="btn btn-primary" style="margin-top: 15px; width: 100%;">Final Girişine Devam Et →</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Akademik Not Hesaplama ve Planlama Sistemi. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
