<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstatistikler | Proje Portalı</title>

    <!-- Kritik Kaynakları Önceden Yükle -->
    <link rel="preload" href="shared_style.css" as="style">
    

    <!-- Diğer Sayfaları Önceden Getir (Prefetch) -->
    <link rel="prefetch" href="index.html">
    <link rel="prefetch" href="hakkimizda.html">
    <link rel="prefetch" href="galeri.html">
    <link rel="prefetch" href="iletisim.html">
    <link rel="prefetch" href="nasil-yapildi.html">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared_style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    

    <nav class="main-nav">
        <ul>
            <li><a href="index.html" title="Portal"><i class="fa-solid fa-house"></i> Portal</a></li>
        </ul>
    </nav>

    <main>
        <section class="content-dashboard">
            
            
            
            <div class="content-scroll">
                <h2>Büyük Şehirler Hava Durumu Analizi</h2>
                <p>Türkiye'deki büyükşehir verilerinin grafiksel analizi ve detaylı kıyaslaması.</p>
                
                <div class="charts-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
                    <div class="chart-container" style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);">
                        <canvas id="tempLineChart"></canvas>
                    </div>
                    <div class="chart-container" style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);">
                        <canvas id="humidityPieChart"></canvas>
                    </div>
                </div>
                
                <div class="charts-grid" style="margin-top:20px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);">
                    <canvas id="windBarChart" style="max-height: 250px;"></canvas>
                </div>

                <!-- Dinamik Hava Durumu Karşılaştırma Tablosu (Kriter 3 & 5) -->
                <div class="list-container" style="margin-top: 20px;">
                    <h3 style="color: #0f172a; margin-bottom: 15px; font-weight: 800; font-size: 1.1rem;">📊 Detaylı Hava Durumu Kıyaslama Tablosu</h3>
                    <div class="table-container" id="comparisonTableContainer">
                        <!-- JS ile Dinamik Doldurulacaktır -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Proje Portalı. Tüm Hakları Saklıdır.</p>
    </footer>

    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Chart.defaults.color = "rgba(255, 255, 255, 0.8)";
            Chart.defaults.font.family = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";

            // Sıcaklık Kıyaslaması (Line Chart)
            const ctxTemp = document.getElementById('tempLineChart').getContext('2d');
            new Chart(ctxTemp, {
                type: 'line',
                data: {
                    labels: ['İstanbul', 'Ankara', 'İzmir', 'Erzurum', 'Antalya'],
                    datasets: [{
                        label: 'Ortalama Sıcaklık (°C)',
                        data: [18, 15, 26, -2, 29],
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#f59e0b',
                        pointRadius: 5,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'top' }, title: { display: true, text: 'Şehir Sıcaklık Trendi', color: '#fff' } },
                    scales: { y: { grid: { color: 'rgba(255,255,255,0.1)' } }, x: { grid: { color: 'rgba(255,255,255,0.1)' } } }
                }
            });

            // Nem Oranı (Doughnut Chart)
            const ctxHum = document.getElementById('humidityPieChart').getContext('2d');
            new Chart(ctxHum, {
                type: 'doughnut',
                data: {
                    labels: ['İstanbul', 'Ankara', 'İzmir', 'Erzurum', 'Antalya'],
                    datasets: [{
                        label: 'Nem Oranı (%)',
                        data: [75, 60, 55, 85, 50],
                        backgroundColor: [
                            'rgba(59, 130, 246, 0.7)',
                            'rgba(16, 185, 129, 0.7)',
                            'rgba(245, 158, 11, 0.7)',
                            'rgba(139, 92, 246, 0.7)',
                            'rgba(239, 68, 68, 0.7)'
                        ],
                        borderColor: 'rgba(0,0,0,0.3)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'right' }, title: { display: true, text: 'Nem Oranı Karşılaştırması', color: '#fff' } }
                }
            });

            // Rüzgar Hızı (Bar Chart)
            const ctxWind = document.getElementById('windBarChart').getContext('2d');
            new Chart(ctxWind, {
                type: 'bar',
                data: {
                    labels: ['İstanbul', 'Ankara', 'İzmir', 'Erzurum', 'Antalya'],
                    datasets: [{
                        label: 'Rüzgar Hızı (km/s)',
                        data: [22, 11, 14, 12, 10],
                        backgroundColor: 'rgba(16, 185, 129, 0.6)',
                        borderColor: 'rgba(16, 185, 129, 1)',
                        borderWidth: 2,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, title: { display: true, text: 'Rüzgar Hızı (km/s)', color: '#fff' } },
                    scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } }, x: { grid: { display: false } } }
                }
            });

            // Dinamik Karşılaştırma Tablosu (Kriter 3 & Kriter 5: Dizi/Nesne döngüsü ile sayfa içeriği üretme)
            const citiesCompareData = [
                { city: 'İstanbul', temp: 18, humidity: 75, wind: 22, condition: 'Yağmurlu', emoji: '🌧️' },
                { city: 'Ankara', temp: 15, humidity: 60, wind: 11, condition: 'Kısmen Bulutlu', emoji: '⛅' },
                { city: 'İzmir', temp: 26, humidity: 55, wind: 14, condition: 'Güneşli', emoji: '☀️' },
                { city: 'Erzurum', temp: -2, humidity: 85, wind: 12, condition: 'Karlı', emoji: '❄️' },
                { city: 'Antalya', temp: 29, humidity: 50, wind: 10, condition: 'Güneşli', emoji: '☀️' }
            ];

            const tableContainer = document.getElementById('comparisonTableContainer');
            if (tableContainer) {
                // Tablo yapısını oluşturma
                const table = document.createElement('table');
                table.style.width = '100%';
                table.style.borderCollapse = 'collapse';
                
                // Başlık Satırı (Thead)
                table.innerHTML = `
                    <thead>
                        <tr style="border-bottom: 2px solid rgba(0,0,0,0.15);">
                            <th style="color: #0f172a; font-weight:700; text-align:left; padding: 12px;">Şehir</th>
                            <th style="color: #0f172a; font-weight:700; text-align:left; padding: 12px;">Sıcaklık (°C)</th>
                            <th style="color: #0f172a; font-weight:700; text-align:left; padding: 12px;">Nem Oranı</th>
                            <th style="color: #0f172a; font-weight:700; text-align:left; padding: 12px;">Rüzgar Hızı</th>
                            <th style="color: #0f172a; font-weight:700; text-align:left; padding: 12px;">Durum</th>
                        </tr>
                    </thead>
                    <tbody id="compareTableBody"></tbody>
                `;
                tableContainer.appendChild(table);

                const tbody = document.getElementById('compareTableBody');
                // Döngü ile dinamik satır ekleme (HTML üretimi)
                citiesCompareData.forEach(item => {
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid rgba(0, 0, 0, 0.08)';
                    row.innerHTML = `
                        <td style="padding: 12px; font-weight:700; color:#0f172a;">${item.city}</td>
                        <td style="padding: 12px; font-weight:600; color:#0f172a;">${item.temp}°C</td>
                        <td style="padding: 12px; font-weight:600; color:#0f172a;">%${item.humidity}</td>
                        <td style="padding: 12px; font-weight:600; color:#0f172a;">${item.wind} km/s</td>
                        <td style="padding: 12px; font-weight:600; color:#0f172a;">${item.emoji} ${item.condition}</td>
                    `;
                    tbody.appendChild(row);
                });
            }
        });
    </script>
</body>
</html>
