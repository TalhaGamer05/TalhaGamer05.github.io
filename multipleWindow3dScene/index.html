<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Çoklu Pencere 3D Deneyimi</title>
	
	<!-- Orijinal kütüphanen -->
	<script type="text/javascript" src="three.r124.min.js"></script>
	
	<!-- Google Fonts (Şık bir tipografi için) -->
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

	<style type="text/css">
		/* Temel Sıfırlama */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Inter', sans-serif;
		}

		/* Arka planın siyah olması ve kaydırma çubuklarının gizlenmesi */
		body {
			background-color: #050505;
			color: #ffffff;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
		}

		/* 3D Modelin Çalışacağı Arka Plan Katmanı */
		#webgl-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1; /* En altta duracak */
		}

		/* Modern Arayüz Katmanı (UI) */
		#ui-layer {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 10; /* 3D'nin üstünde duracak */
			
			/* Fare tıklamalarını UI katmanından geçirip arka plandaki 3D evrene aktarır */
			pointer-events: none; 
			
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 2.5rem;
		}

		/* Buzlu Cam Efektli (Glassmorphism) Bilgi Kartı */
		.info-card {
			pointer-events: auto; /* Sadece bu karta tıklanabilsin */
			background: rgba(25, 25, 25, 0.4);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border: 1px solid rgba(255, 255, 255, 0.1);
			padding: 2rem;
			border-radius: 20px;
			max-width: 400px;
			box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
			animation: fadeIn 1.5s ease-out;
		}

		.info-card h1 {
			font-size: 1.8rem;
			font-weight: 700;
			margin-bottom: 0.5rem;
			/* Yazıya metalik/parlak bir geçiş efekti */
			background: linear-gradient(90deg, #ffffff, #888888);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.info-card p {
			font-size: 0.95rem;
			color: #a0a0a0;
			line-height: 1.5;
			font-weight: 300;
		}

		/* Alt Kontrol Butonları */
		.controls {
			pointer-events: auto;
			display: flex;
			gap: 1rem;
		}

		button {
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.15);
			color: #ffffff;
			padding: 0.8rem 1.5rem;
			border-radius: 12px;
			font-size: 0.9rem;
			font-weight: 500;
			cursor: pointer;
			backdrop-filter: blur(8px);
			transition: all 0.3s ease;
		}

		button:hover {
			background: rgba(255, 255, 255, 0.15);
			border-color: rgba(255, 255, 255, 0.4);
			transform: translateY(-3px);
			box-shadow: 0 5px 15px rgba(0,0,0,0.3);
		}

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(-20px); }
			to { opacity: 1; transform: translateY(0); }
		}
	</style>
</head>
<body>
	
	<!-- 3D Dünyanın Çizileceği Kapsayıcı (main.js burayı veya body'yi kullanır) -->
	<div id="webgl-container"></div>

	<!-- Şık Arayüzümüz -->
	<div id="ui-layer">
		
		 <div class="info-card" hidden>
			<h1>Kuantum Ağı</h1>
			<p>Bu ekran, daha büyük bir 3D evrenin sadece küçük bir penceresidir. Görsel bağlantıyı başlatmak için yeni bir pencere açın ve pencereleri birbirine yaklaştırın.</p>
		</div>

		<div class="controls">
			<!-- Doğrudan yeni bir pop-up pencere açan pratik buton -->
			<button onclick="window.open(window.location.href, '_blank', 'width=800,height=600')">
				+ Yeni Pencere Aç
			</button>
			<button onclick="window.location.reload()">
				⟳ Senkronizasyonu Yenile
			</button>
		</div>

	</div>

	<!-- Orijinal motorunu en sonda çağırıyoruz -->
	<script type="module" src="main.js"></script>
</body>
</html>
