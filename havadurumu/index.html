        function closeSidebar() {
            sidebar.classList.remove('visible');
            sidebarBackdrop.classList.remove('visible');
            if (hamburgerMenu) hamburgerMenu.classList.remove('active');
        }

        function openSidebar() {
            sidebar.classList.add('visible');
            sidebarBackdrop.classList.add('visible');
            if (hamburgerMenu) hamburgerMenu.classList.add('active');
        }

        if (hamburgerMenu) {
            hamburgerMenu.addEventListener('click', () => {
                const isVisible = sidebar.classList.contains('visible');
                if (isVisible) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });
        }

        const mainEl = document.querySelector('main');
        if (sidebar && mainEl) {
            sidebar.addEventListener('mouseenter', () => {
                if (window.innerWidth > 768) {
                    mainEl.style.filter = 'blur(8px)';
                    mainEl.style.opacity = '0.85';
                }
            });
            sidebar.addEventListener('mouseleave', () => {
                if (window.innerWidth > 768) {
                    mainEl.style.filter = 'none';
                    mainEl.style.opacity = '1';
                }
            });
        }
        if (sidebarTrigger) {
            sidebarTrigger.addEventListener('click', openSidebar);
        }
        if (sidebarBackdrop) {
            sidebarBackdrop.addEventListener('click', closeSidebar);
        }

        document.getElementById('luckyBtn').addEventListener('click', feelingLucky);
        // map initialized automatically

        // ==========================================
        // KLAVYE KISAYOLLARI (EVENTS)
        // ==========================================
        document.addEventListener('keydown', (e) => {
            // Arama alanına yazı yazılıyorsa kısayolları durdur
            if (document.activeElement === document.getElementById('searchInput')) {
                if (e.key === 'Escape') {
                    document.getElementById('searchInput').blur();
                    closeSidebar();
                }
                return;
            }

            const key = e.key.toLowerCase();
            if (key === 's') {
                e.preventDefault();
                openSidebar();
                setTimeout(() => document.getElementById('searchInput').focus(), 150);
            } else if (key === 'm') {
                e.preventDefault();
                // map is visible
            } else if (key === 'l') {
                e.preventDefault();
                feelingLucky();
            } else if (e.key === 'Escape') {
                closeSidebar();
                const mapContainer = document.getElementById('mapContainer');
                if (mapContainer) mapContainer.style.display = 'none';
            } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                const activeBtn = document.querySelector('.city-btn.active');
                if (activeBtn) {
                    const buttons = Array.from(document.querySelectorAll('.city-btn'));
                    const currentIndex = buttons.indexOf(activeBtn);
                    let nextIndex = currentIndex;

                    if (e.key === 'ArrowRight') {
                        nextIndex = (currentIndex + 1) % buttons.length;
                    } else {
                        nextIndex = (currentIndex - 1 + buttons.length) % buttons.length;
                    }
                    buttons[nextIndex].click();
                }
            }
        });

        // Arama Formu İşlemi
        document.getElementById('searchForm').addEventListener('submit', function (e) {
            e.preventDefault();
            let searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            searchTerm = searchTerm.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const charMap = { 'ı': 'i', 'ğ': 'g', 'ü': 'u', 'ş': 's', 'ö': 'o', 'ç': 'c' };
            searchTerm = searchTerm.replace(/[ığüşöç]/g, match => charMap[match]);

            if (citiesWeatherData[searchTerm]) {
                const targetButton = document.querySelector(`.city-btn[data-city="${searchTerm}"]`);
                loadWeather(searchTerm, targetButton);
                closeSidebar();
            } else {
                alert("Şehir bulunamadı! Lütfen kayıtlı şehirleri deneyin (Örn: Gönen, Bandırma, İstanbul).");
            }
            document.getElementById('searchInput').value = '';
        });

        function feelingLucky() {
            const keys = Object.keys(citiesWeatherData);
            if (keys.length === 0) return;
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            currentSelectedCity = randomKey;
            loadWeather(randomKey);
            createCityButtons();
            setTimeout(() => {
                const btn = document.querySelector(`.city-btn[data-city="${randomKey}"]`);
                if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }



        function mapWmoToCondition(code) {
            if (code === 0) {
                return { condition: "Güneşli", emoji: "☀️" };
            } else if (code >= 1 && code <= 3) {
                return { condition: "Kısmen Bulutlu", emoji: "⛅" };
            } else if (code === 45 || code === 48) {
                return { condition: "Bulutlu", emoji: "☁️" };
            } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
                return { condition: "Yağmurlu", emoji: "🌧️" };
            } else if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) {
                return { condition: "Karlı", emoji: "❄️" };
            } else if (code >= 95) {
                return { condition: "Fırtınalı", emoji: "⛈️" };
            } else {
                return { condition: "Güneşli", emoji: "☀️" };
            }
        }

        function updateBackgroundVideo(condition) {
            const videoElement = document.getElementById('bg-video');
            const sourceElement = document.getElementById('bg-video-source');

            let targetVideo = 'videolar/gunesli.mp4';
            const condLower = condition.toLowerCase();

            if (condLower.includes('yağmur') || condLower.includes('çiseleyen') || condLower.includes('sağnak')) {
                targetVideo = 'videolar/yagmur.mp4';
            } else if (condLower.includes('bulut') || condLower.includes('sis')) {
                targetVideo = 'videolar/bulutlu.mp4';
            } else if (condLower.includes('kar')) {
                targetVideo = 'videolar/karli.mp4';
            } else if (condLower.includes('güneş') || condLower.includes('açık')) {
                targetVideo = 'videolar/gunesli.mp4';
            } else if (condLower.includes('fırtına')) {
                targetVideo = 'videolar/firtinali.mp4';
            }

            if (!sourceElement.src.endsWith(targetVideo)) {
                sourceElement.src = targetVideo;
                videoElement.load(); 
                videoElement.play().catch(e => console.log("Video oynatılamadı:", e)); 
            }
        }

        async function loadWeather(cityKey, button) {
            document.querySelectorAll('.city-btn').forEach(btn => btn.classList.remove('active'));
            if (button) button.classList.add('active');

            const container = document.getElementById('weatherContainer');
            container.innerHTML = `
                <div class="weather-dashboard skeleton-active">
                    <div class="skeleton-header">
                        <div class="skeleton-shimmer skeleton-circle"></div>
                        <div class="skeleton-shimmer skeleton-text title"></div>
                        <div class="skeleton-shimmer skeleton-text huge"></div>
                        <div class="skeleton-shimmer skeleton-text sub"></div>
                    </div>
                </div>
            `;

            try {
                const coord = cityCoordinates[cityKey];
                if (!coord) throw new Error("Koordinat bulunamadı.");

                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coord[0]}&longitude=${coord[1]}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure,visibility,dew_point_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`);
                if (!response.ok) throw new Error("API hatası.");

                const data = await response.json();
                const currentMapped = mapWmoToCondition(data.current.weather_code);

                const weekdays = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
                const forecast = [];
                for (let i = 0; i < 7; i++) {
                    const dateStr = data.daily.time[i];
                    const dateObj = new Date(dateStr);
                    const dayIndex = (dateObj.getDay() + 6) % 7; // Sunday=0 mapped to index 6, Monday=1 to index 0
                    const dailyMapped = mapWmoToCondition(data.daily.weather_code[i]);
                    forecast.push({
                        day: weekdays[dayIndex],
                        high: Math.round(data.daily.temperature_2m_max[i]),
                        low: Math.round(data.daily.temperature_2m_min[i]),
                        condition: dailyMapped.condition,
                        emoji: dailyMapped.emoji
                    });
                }

                const staticInfo = citiesWeatherData[cityKey] || { city: cityKey.charAt(0).toUpperCase() + cityKey.slice(1), country: "Türkiye" };
                const weatherData = {
                    city: staticInfo.city,
                    country: staticInfo.country,
                    temperature: Math.round(data.current.temperature_2m),
                    condition: currentMapped.condition,
                    emoji: currentMapped.emoji,
                    humidity: Math.round(data.current.relative_humidity_2m),
                    windSpeed: Math.round(data.current.wind_speed_10m),
                    pressure: Math.round(data.current.surface_pressure),
                    uvIndex: data.daily.uv_index_max ? Math.round(data.daily.uv_index_max[0]) : 0,
                    feelsLike: Math.round(data.current.apparent_temperature),
                    visibility: Math.round(data.current.visibility / 1000), // convert to km
                    dewPoint: Math.round(data.current.dew_point_2m),
                    forecast: forecast
                };

                generateDashboard(weatherData);
                updateBackgroundVideo(weatherData.condition);
            } catch (err) {
                console.warn("API'den veri alınamadı, statik yedek veri kullanılıyor:", err);
                const weatherData = citiesWeatherData[cityKey];
                if (weatherData) {
                    generateDashboard(weatherData);
                    updateBackgroundVideo(weatherData.condition);
                } else {
                    container.innerHTML = `<div class="weather-dashboard" style="padding: 2rem; color: white; text-align: center;"><h3>Hava durumu verileri yüklenemedi. Lütfen internet bağlantınızı kontrol edin.</h3></div>`;
                }
            }
        }

            "igdir": [39.9237, 44.045], "yalova": [40.65, 29.2667], "karabuk": [41.2061, 32.6204],

        };

        
        // ==========================================
        // BÖLGE KATALOĞU & ŞEHİR LİSTESİ YÖNETİMİ
        // ==========================================
        const cityRegions = {
            popular: ['istanbul', 'ankara', 'izmir', 'bursa', 'antalya', 'adana', 'trabzon', 'erzurum', 'diyarbakir', 'gaziantep', 'balikesir', 'gonen', 'bandirma'],
            marmara: ['istanbul', 'bursa', 'canakkale', 'balikesir', 'edirne', 'kirklareli', 'kocaeli', 'sakarya', 'tekirdag', 'yalova', 'bandirma', 'gonen', 'bilecik'],
            ege: ['izmir', 'aydin', 'denizli', 'manisa', 'mugla', 'kutahya', 'usak', 'afyonkarahisar'],
            akdeniz: ['adana', 'antalya', 'burdur', 'hatay', 'isparta', 'mersin', 'kahramanmaras', 'osmaniye'],
            ic_anadolu: ['ankara', 'cankiri', 'eskisehir', 'kayseri', 'kirsehir', 'konya', 'nevsehir', 'nigde', 'sivas', 'yozgat', 'aksaray', 'karaman', 'kirikkale'],
            karadeniz: ['amasya', 'artvin', 'bolu', 'corum', 'giresun', 'gumushane', 'kastamonu', 'ordu', 'rize', 'samsun', 'sinop', 'tokat', 'trabzon', 'zonguldak', 'bayburt', 'bartin', 'karabuk', 'duzce'],
            dogu: ['agri', 'bingol', 'bitlis', 'diyarbakir', 'elazig', 'erzincan', 'erzurum', 'gaziantep', 'hakkari', 'kars', 'malatya', 'mardin', 'mus', 'siirt', 'tunceli', 'sanliurfa', 'van', 'batman', 'sirnak', 'ardahan', 'igdir', 'kilis', 'adiyaman']
        };

        let currentActiveRegion = 'all';
        let currentActiveSearch = '';
        let currentSelectedCity = 'istanbul';

        function createCityButtons() {
            const selector = document.getElementById('citySelector');
            selector.innerHTML = '';

            const keys = Object.keys(citiesWeatherData).sort((a,b) => citiesWeatherData[a].city.localeCompare(citiesWeatherData[b].city, 'tr'));

            const filteredKeys = keys.filter(key => {
                const cityObj = citiesWeatherData[key];
                // Region filter
                if (currentActiveRegion !== 'all') {
                    const regionList = cityRegions[currentActiveRegion] || [];
                    if (!regionList.includes(key)) return false;
                }
                // Search filter
                if (currentActiveSearch) {
                    const normSearch = currentActiveSearch.toLowerCase().replace(/[̀-ͯ]/g, "");
                    const normCity = cityObj.city.toLowerCase().replace(/[̀-ͯ]/g, "");
                    if (!normCity.includes(normSearch) && !key.includes(normSearch)) return false;
                }
                return true;
            });

            if (filteredKeys.length === 0) {
                selector.innerHTML = '<div style="text-align:center; color:#64748b; padding:1.5rem 0; font-size:0.85rem;">Eşleşen şehir bulunamadı.</div>';
                return;
            }

            filteredKeys.forEach((key) => {
                const data = citiesWeatherData[key];
                const btn = document.createElement('button');
                btn.className = `city-btn ${key === currentSelectedCity ? 'active' : ''}`;
                btn.dataset.city = key;
                btn.innerHTML = `
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                        <span>${data.emoji}</span>
                        <span>${data.city}</span>
                    </div>
                    <span class="badge-temp">${data.temperature}°C</span>
                `;
                btn.addEventListener('click', () => {
                    currentSelectedCity = key;
                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadWeather(key, btn);
                    if (window.innerWidth <= 768) closeSidebar();
                });
                selector.appendChild(btn);
            });
        }

        // Şehir Sekmeleri Dinleyicisi
        document.querySelectorAll('.city-tab-btn').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.city-tab-btn').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentActiveRegion = tab.dataset.region;
                createCityButtons();
            });
        });

        // Canlı Arama Dinleyicisi
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            currentActiveSearch = e.target.value.trim();
            createCityButtons();
        });

        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const firstBtn = document.querySelector('.city-btn');
            if (firstBtn) firstBtn.click();
        });

        // ==========================================
        // İNTERAKTİF HARİTA (Leaflet)
        // ==========================================
        function initLeafletMap() {
            try {
                map = L.map('leafletMap', {
                    zoomControl: false,
                    attributionControl: false
                }).setView([39.0, 35.2], 5);

                L.control.zoom({ position: 'bottomright' }).addTo(map);

                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 18
                }).addTo(map);

                for (let cityKey in citiesWeatherData) {
                    if (cityCoordinates[cityKey]) {
                        const coord = cityCoordinates[cityKey];
                        const cityData = citiesWeatherData[cityKey];
                        const marker = L.circleMarker(coord, {
                            color: '#8b5cf6',
                            fillColor: '#3b82f6',
                            radius: 6,
                            fillOpacity: 0.85,
                            weight: 2
                        }).addTo(map);

                        marker.bindPopup(`<b>${cityData.city}</b>: ${cityData.temperature}°C ${cityData.emoji}`, { closeButton: false });

                        marker.on('mouseover', function() { this.openPopup(); });
                        marker.on('mouseout', function() { this.closePopup(); });
                        marker.on('click', () => {
                            currentSelectedCity = cityKey;
                            loadWeather(cityKey);
                            createCityButtons();
                        });
                    }
                }
                setTimeout(() => map.invalidateSize(), 300);
            } catch (e) {
                console.error("Harita başlatma hatası:", e);
            }
        }

        // ==========================================
        // DEVRİM NİTELİĞİNDE ŞEHİRLER HARİÇ TÜM SAYFAYI BLURLAMA
        // ==========================================
        const blurElements = () => document.querySelectorAll('#bg-video, main, .main-nav, .main-footer, #mapContainer');
        const sidebarEl = document.getElementById('sidebar');

        if (sidebarEl) {
            sidebarEl.addEventListener('mouseenter', () => {
                if (window.innerWidth > 768) {
                    blurElements().forEach(el => {
                        el.style.filter = 'blur(16px) brightness(0.4)';
                        if (el.tagName === 'MAIN') el.style.transform = 'scale(0.985)';
                        el.style.transition = 'filter 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s ease, brightness 0.35s ease, opacity 0.35s ease';
                    });
                }
            });

            sidebarEl.addEventListener('mouseleave', () => {
                if (window.innerWidth > 768) {
                    blurElements().forEach(el => {
                        el.style.filter = 'none';
                        el.style.transform = 'none';
                    });
                }
            });
        }

        document.addEventListener("DOMContentLoaded", () => { createCityButtons(); initLeafletMap(); loadWeather("istanbul"); });

        // ==========================================
        // SERVICE WORKER KAYDI (PWA İÇİN)
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((registration) => {
                    console.log('ServiceWorker kayıt başarılı: ', registration.scope);
                }, (err) => {
                    console.log('ServiceWorker kayıt başarısız: ', err);
                });
            });
        }
    </script>
